[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mycom-app"
version = "0.1.0"
description = "Lab package used to exercise a build-and-publish pipeline end to end."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mycom lab" }]
keywords = ["lab", "release-pipeline"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

[project.scripts]
mycom-app = "mycom_app.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/mycom_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
