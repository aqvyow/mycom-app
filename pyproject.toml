[build-system]
# Upper bound on purpose: newer hatchling releases emit Metadata-Version 2.5,
# which the publish action's bundled tooling rejects ("'2.5' is not a valid
# metadata version"). 1.26 emits 2.3.
requires = ["hatchling>=1.25,<1.27"]
build-backend = "hatchling.build"

[project]
name = "mycom-app"
version = "0.1.2"
description = "Lab package used to exercise a build-and-publish pipeline end to end."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mycom lab" }]
keywords = ["lab", "release-pipeline"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

[project.scripts]
mycom-app = "mycom_app.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/mycom_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
